<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FM Notebook · Exam FM, one timeline at a time</title>
    <meta name="description" content="A no-calculator study notebook for SOA Exam FM: lessons drawn on timelines, guided step-by-step reasoning, and spaced review." />
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="vendor/katex/katex.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-view="home">
    <a class="skip" href="#app">跳到正文</a>
    <header class="nav">
      <a class="logo" href="#/" aria-label="FM Notebook, home"><span class="mono">FM</span><i>notebook</i></a>
      <nav aria-label="Main">
        <ol>
          <li><a href="#/" data-scroll="syllabus">Syllabus</a></li>
          <li><a href="#/practice">Review</a></li>
          <li><a href="#/formulas">Formulas</a></li>
          <li><a href="#/settings">Settings</a></li>
        </ol>
      </nav>
      <a class="home-link" href="https://ellensyuu.github.io/">Ziyi Zhou <span aria-hidden="true">↗</span></a>
    </header>

    <main id="app" tabindex="-1">
      <noscript><p style="padding: 160px 24px">FM Notebook needs JavaScript to run.</p></noscript>
    </main>

    <footer class="foot">
      <p>
        Written and drawn by <a href="https://ellensyuu.github.io/">Ziyi Zhou</a> ·
        <a href="https://github.com/EllenSyuu/FM">source</a> · <a href="#/settings">settings</a> ·
        not affiliated with the Society of Actuaries · your progress stays in this browser
      </p>
    </footer>
    <script>
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[data-scroll]');
        if (!a) return;
        e.preventDefault();
        var go = function () {
          var el = document.getElementById(a.dataset.scroll);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        if (location.hash !== '#/' && location.hash !== '') {
          location.hash = '#/';
          setTimeout(go, 120);
        } else go();
      });
    </script>
  </body>
</html>
